name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: cl main.c

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ping-exe
          path: main.exe
